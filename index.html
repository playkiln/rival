<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rival</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
    <!-- Official Playkiln SDK (protocol v1) — host owns sessions and results -->
    <script>
      // Capabilities are declared only once they are genuinely handled, absent
      // case and all. Audio arrives with the sound stage; storage is handled by
      // src/host/SaveStore.ts, including hosts that have none.
      window.PlaykilnOptions = { capabilities: { storage: true, audio: true } }
    </script>
    <script src="./playkiln-sdk.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
